<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tùy Tâm Sales</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tùy Tâm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" type="image/png" href="icon-192.png">

<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* Layout: dark wine sidebar as the "showroom wall", ivory-rose work surface; gold reserved for money and tier marks */
:root{
  --bg:#F6F2F1; --surface:#FFFFFF; --surface-2:#FBF7F6; --ink:#2A1719; --muted:#7B6466; --line:#E9DEDC;
  --wine:#86202A; --wine-ink:#FFFFFF; --side:#3E0F14; --side-ink:#F1E3D0; --side-muted:#B89A90;
  --gold:#A57A28; --gold-soft:#F6EBD3; --wine-soft:#F7E4E5;
  --ok:#2C7A4E; --ok-soft:#E3F2E9; --warn:#A8690F; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE3E1;
  --shadow:0 1px 2px rgba(62,15,20,.06),0 6px 24px rgba(62,15,20,.06);
  --f-display:Georgia,"Times New Roman",serif;
  --f-body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151012; --surface:#1E1719; --surface-2:#251C1F; --ink:#F2E8E5; --muted:#A99496; --line:#3A2D30;
  --wine:#D9626A; --wine-ink:#1A0B0D; --side:#0E090A; --side-ink:#EBD9C0; --side-muted:#8F7A72;
  --gold:#DDB463; --gold-soft:#3A2E18; --wine-soft:#3B1E22;
  --ok:#62C08B; --ok-soft:#173326; --warn:#E3AA4E; --warn-soft:#3A2A12; --bad:#F06E64; --bad-soft:#3E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151012; --surface:#1E1719; --surface-2:#251C1F; --ink:#F2E8E5; --muted:#A99496; --line:#3A2D30;
  --wine:#D9626A; --wine-ink:#1A0B0D; --side:#0E090A; --side-ink:#EBD9C0; --side-muted:#8F7A72;
  --gold:#DDB463; --gold-soft:#3A2E18; --wine-soft:#3B1E22;
  --ok:#62C08B; --ok-soft:#173326; --warn:#E3AA4E; --warn-soft:#3A2A12; --bad:#F06E64; --bad-soft:#3E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);color:var(--gold);font-size:18px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:.02em;color:var(--side-ink);line-height:1.1}
.brand small{font-size:10.5px;letter-spacing:.32em;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a:hover{color:var(--side-ink);background:rgba(255,255,255,.05)}
.nav a.on{color:var(--side-ink);background:rgba(221,180,99,.14);box-shadow:inset 2px 0 0 var(--gold)}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--side-muted);margin-right:6px}
.dot.live{background:#62C08B}
/* main */
.main{min-width:0;padding-block:26px 60px;padding-left:max(16px,2.4vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.4vw)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-family:var(--f-display);font-size:30px;margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:15px;margin:0;font-weight:600}
.panel-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi .lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.gold .val{color:var(--gold)}
.up{color:var(--ok)} .down{color:var(--bad)}
/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.pname{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-wine{background:var(--wine-soft);color:var(--wine)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.tier i{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--gold);display:inline-block}
.tier[data-l="1"] i{background:transparent}
.tier[data-l="2"] i{background:linear-gradient(135deg,var(--gold) 50%,transparent 50%)}
.tier[data-l="3"] i,.tier[data-l="4"] i,.tier[data-l="5"] i{background:var(--gold)}
.tier[data-l="4"] i{box-shadow:0 0 0 2px var(--gold-soft)}
.tier[data-l="5"] i{box-shadow:0 0 0 2px var(--gold-soft),0 0 0 3.5px var(--gold)}
.money{color:var(--gold);font-weight:700}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > span{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar.ok > span{background:var(--ok)} .bar.bad > span{background:var(--bad)} .bar.warn > span{background:var(--warn)}
/* toolbar */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--wine-soft);color:var(--wine)}
select,input[type=text],input[type=number],input[type=date],input[type=tel],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f > *{font-weight:400;color:var(--ink);font-size:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
/* sale */
.sale{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;position:relative}
.prod:hover{border-color:var(--gold)}
.prod.in{border-color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine)}
.prod .nm{font-weight:600;line-height:1.3;font-size:13.5px}
.prod .sz{font-size:12px;color:var(--muted)}
.prod .pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;gap:6px}
.prod .pr s{color:var(--muted);font-size:12px}
.prod .badge{position:absolute;top:-8px;right:-8px;background:var(--wine);color:var(--wine-ink);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.prod .stk{font-size:11.5px}
.tp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:2px}
.tp span{display:flex;flex-direction:column;padding:3px 5px;border-radius:5px;background:var(--surface-2);font-size:11.5px;line-height:1.25;font-variant-numeric:tabular-nums;min-width:0}
.tp span em{font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.04em;font-weight:600}
.tp span.on{background:var(--wine-soft);color:var(--wine);font-weight:700;box-shadow:inset 0 0 0 1px var(--wine)}
.tp span.on em{color:var(--wine)}
.tiersel{display:flex;flex-direction:column;gap:6px}
.ctype{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ctype button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 6px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted);line-height:1.25}
.ctype button.on{background:var(--wine);border-color:var(--wine);color:var(--wine-ink);font-weight:600}
.sug{border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.sug button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;gap:1px}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button:focus-visible{background:var(--surface-2)}
.sug .s1{font-weight:600;font-size:13px}.sug .s2{font-size:12px;color:var(--muted)}
.custgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.custgrid .full{grid-column:1/-1}
.tiersel .lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.cart{position:sticky;top:16px}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cart-line:last-child{border-bottom:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:28px;height:28px;cursor:pointer;font-size:15px}
.qty input{width:46px;border:0;text-align:center;padding:4px 0;border-radius:0;background:var(--surface)}
.sum-row{display:flex;justify-content:space-between;padding:4px 0}
.sum-row.total{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.note{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--gold-soft);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,8,10,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow-y:auto}
.modal-box{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal-box.wide{max-width:860px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-family:var(--f-display);font-size:20px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;margin-bottom:16px;font-size:13px}
.invoice-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:14px}
.invoice-head .co{font-family:var(--f-display);font-size:22px;color:var(--wine)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .v{fill:var(--ink);font-weight:600}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:6px 0}
.hbar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--wine);border-radius:99px}
.policy-t td,.policy-t th{text-align:right}
.policy-t td:first-child,.policy-t th:first-child{text-align:left}
.tier-card{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.loading{opacity:.6}
@media (max-width:1100px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2{grid-template-columns:1fr}.sale{grid-template-columns:1fr}.cart{position:static}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;overflow:hidden}
  .brand small,.side-foot{display:none}
  .brand b{font-size:16px}
  .brand-mark{width:32px;height:32px;font-size:15px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  .nav a{padding:7px 10px;white-space:nowrap;font-size:13px}
  .nav a svg{display:none}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--gold)}
  .g-2e{grid-template-columns:1fr}
  .head h1{font-size:24px}
}
@media (max-width:520px){.form{grid-template-columns:1fr}.g-kpi{gap:10px}.kpi .val{font-size:20px}.hbar{grid-template-columns:90px 1fr auto}}
@media (max-width:820px){input,select,textarea{font-size:16px!important}.qty button{width:34px;height:34px}.nav a{padding:9px 12px}}
.search input{padding-left:36px!important}
a.btn{text-decoration:none}
.bk-card{display:flex;flex-direction:column;gap:10px}
.bk-big{font-size:15px;padding:12px 18px;justify-content:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">T</div><div><b>Tùy Tâm</b><small>PHARMA</small></div></div>

    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

/* ===================== TRẠNG THÁI & LƯU TRỮ ===================== */
const S={partners:{},orders:{},inventory:{},customers:{},mode:'loading'};

const LS_KEY='tuytam-local-v1';

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(d){S.partners=d.partners||{};S.orders=d.orders||{};S.inventory=d.inventory||{};S.customers=d.customers||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({partners:S.partners,orders:S.orders,inventory:S.inventory,customers:S.customers}))}catch(e){}}
async function put(col,id,data){
  if(S.mode==='db'){await db.collection(col).doc(id).set(data)}
  else{S[col][id]=data;saveLocal();render()}
}
async function del(col,id){
  if(S.mode==='db'){await db.collection(col).doc(id).delete()}
  else{delete S[col][id];saveLocal();render()}
}
function snapTo(col,snap){const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[col]=o;scheduleRender()}
let rq=false;function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}

async function boot(){
  S.mode='local';loadLocal();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  setSync();render();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    try{navigator.serviceWorker.register('sw.js')}catch(e){}
  }
}
function setSync(){
  const el=document.getElementById('syncState');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Math.round(n||0).toLocaleString('vi-VN')+' ₫';
const nf=n=>Math.round(n||0).toLocaleString('vi-VN');
const tr=n=>{n=n||0;if(Math.abs(n)>=1e9)return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';if(Math.abs(n)>=1e6)return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr';return nf(n)};
const fdate=s=>{if(!s)return'';const d=new Date(s);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})};
const today=()=>new Date();
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tierName=k=>(TIERS[TI[k]]||TIERS[0]).name;
const tierTag=k=>{const t=TIERS[TI[k]]||TIERS[0];return t.l?`<span class="tier" data-l="${t.l}"><i></i>${esc(t.name)}</span>`:`<span class="pill p-n">Khách lẻ</span>`};
const price=(pid,tier)=>PM[pid]?PM[pid].p[TI[tier]||0]:0;
const ICON={search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
const ordersArr=()=>Object.entries(S.orders).map(([id,o])=>({id,...o})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const partnersArr=()=>Object.entries(S.partners).map(([id,p])=>({id,...p})).sort((a,b)=>TI[b.tier]-TI[a.tier]||String(a.name).localeCompare(b.name,'vi'));
const active=o=>o.status!=='huy';
const stockOf=pid=>(S.inventory[pid]&&+S.inventory[pid].qty)||0;
const minOf=pid=>(S.inventory[pid]&&+S.inventory[pid].min)||20;
const isSample=()=>Object.values(S.partners).some(p=>p.sample)||Object.values(S.orders).some(o=>o.sample);
function daysAgo(n){const d=today();d.setDate(d.getDate()-n);return d}
function partnerStats(pid){
  const os=ordersArr().filter(o=>o.partnerId===pid&&active(o));
  const since=daysAgo(183).toISOString();
  const s6=os.filter(o=>o.date>=since).reduce((a,o)=>a+o.total,0);
  const all=os.reduce((a,o)=>a+o.total,0);
  const debt=os.reduce((a,o)=>a+Math.max(0,o.total-(o.paid||0)),0);
  return {orders:os,count:os.length,s6,all,debt,last:os[0]&&os[0].date};
}
function keepStatus(p,st){
  const t=TIERS[TI[p.tier]];if(!t||!t.keep)return null;
  const pct=Math.min(100,st.s6/t.keep*100);
  const up=TIERS[TI[p.tier]+1];
  if(up&&st.s6>=up.keep)return {cls:'p-ok',label:'Đủ điều kiện lên '+up.name,pct,bar:'ok'};
  if(st.s6>=t.keep)return {cls:'p-ok',label:'Đạt giữ cấp',pct,bar:'ok'};
  if(pct>=60)return {cls:'p-warn',label:'Còn thiếu '+tr(t.keep-st.s6),pct,bar:'warn'};
  return {cls:'p-bad',label:'Nguy cơ hạ cấp',pct,bar:'bad'};
}

function head(t,sub,act=''){return `<div class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="actions">${act}</div></div>`}
function searchBox(key,ph){return `<div class="search">${ICON.search}<input type="text" id="q-${key}" data-filter="${key}" placeholder="${ph}"></div>`}
function applyFilter(key,v){v=(v||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
  document.querySelectorAll(`[data-fk="${key}"]`).forEach(el=>{const t=(el.dataset.s||'');el.hidden=v&&!t.includes(v)})}
const sKey=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');

/* ---------- Tổng quan ---------- */
function monthKey(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function lastMonths(n){const out=[];const d=today();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({k:monthKey(x),lab:'T'+(x.getMonth()+1)})}return out}
function vDash(){
  const os=ordersArr().filter(active);
  const mk=monthKey(today());
  const pm=lastMonths(2)[0].k;
  const thisM=os.filter(o=>monthKey(o.date)===mk), prevM=os.filter(o=>monthKey(o.date)===pm);
  const rev=thisM.reduce((a,o)=>a+o.total,0), prev=prevM.reduce((a,o)=>a+o.total,0);
  const delta=prev?((rev-prev)/prev*100):null;
  const debt=os.reduce((a,o)=>a+Math.max(0,o.total-(o.paid||0)),0);
  const pend=os.filter(o=>o.status==='cho'||o.status==='giao').length;
  const ps=partnersArr();
  const low=PRODUCTS.filter(p=>stockOf(p.id)<minOf(p.id));
  const months=lastMonths(6).map(m=>({...m,v:os.filter(o=>monthKey(o.date)===m.k).reduce((a,o)=>a+o.total,0)}));
  const risk=ps.map(p=>({p,st:partnerStats(p.id)})).map(x=>({...x,k:keepStatus(x.p,x.st)})).filter(x=>x.k&&x.k.cls!=='p-ok').sort((a,b)=>a.k.pct-b.k.pct).slice(0,5);
  const recent=ordersArr().slice(0,6);
  const top=topProducts(thisM.length?thisM:os).slice(0,5);
  return head('Tổng quan kinh doanh',`Hôm nay ${today().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`,`<button class="btn" data-act="newPartner">+ Thêm đối tác</button><a class="btn pri" href="#ban-hang" data-go="ban-hang">+ Tạo đơn hàng</a>`)+
  `<div class="grid g-kpi">
    <div class="panel kpi gold"><div class="lab">Doanh số tháng ${today().getMonth()+1}</div><div class="val num">${tr(rev)}</div><div class="sub">${delta===null?'Chưa có số tháng trước':`<span class="${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(1)}%</span> so với tháng trước`}</div></div>
    <div class="panel kpi"><div class="lab">Đơn trong tháng</div><div class="val num">${thisM.length}</div><div class="sub">${pend} đơn đang chờ xử lý / giao</div></div>
    <div class="panel kpi"><div class="lab">Công nợ phải thu</div><div class="val num">${tr(debt)}</div><div class="sub">${os.filter(o=>o.total>(o.paid||0)).length} đơn chưa thu đủ</div></div>
    <div class="panel kpi"><div class="lab">Hệ thống đối tác</div><div class="val num">${ps.length}</div><div class="sub">${TIERS.slice(1).map(t=>ps.filter(p=>p.tier===t.k).length).join(' · ')} <span class="muted">(CN·ĐL·NPP·GĐKD·LĐ)</span></div></div>
  </div>
  <div class="grid g-2" style="margin-top:16px">
    <div class="panel"><div class="panel-h"><h2>Doanh số 6 tháng gần nhất</h2><span class="muted small">Không tính đơn đã huỷ</span></div><div class="panel-b">${barChart(months)}</div></div>
    <div class="panel"><div class="panel-h"><h2>Bán chạy ${thisM.length?'trong tháng':'toàn thời gian'}</h2></div><div class="panel-b">${top.length?top.map(t=>hbar(t.name,t.qty,top[0].qty,t.qty+' sp')).join(''):'<div class="empty">Chưa có đơn hàng.</div>'}</div></div>
  </div>
  <div class="grid g-2" style="margin-top:16px">
    <div class="panel"><div class="panel-h"><h2>Đơn hàng gần đây</h2><a href="#don-hang" data-go="don-hang" class="btn ghost sm">Xem tất cả →</a></div>${ordersTable(recent,true)}</div>
    <div class="stack">
      <div class="panel"><div class="panel-h"><h2>Đối tác cần chú ý giữ cấp</h2></div><div class="panel-b stack">${risk.length?risk.map(x=>`<div class="stack" style="gap:5px;cursor:pointer" data-act="viewPartner" data-id="${x.p.id}"><div class="row between"><span class="pname">${esc(x.p.name)}</span><span class="pill ${x.k.cls}">${x.k.label}</span></div><div class="bar ${x.k.bar}"><span style="width:${x.k.pct}%"></span></div><div class="small muted num">${tr(x.st.s6)} / ${tr(TIERS[TI[x.p.tier]].keep)} trong 6 tháng · ${tierName(x.p.tier)}</div></div>`).join(''):'<div class="muted">Tất cả đối tác đang đạt doanh số giữ cấp.</div>'}</div></div>
      <div class="panel"><div class="panel-h"><h2>Sắp hết hàng</h2><a href="#kho" data-go="kho" class="btn ghost sm">Kho →</a></div><div class="panel-b stack" style="gap:8px">${low.length?low.slice(0,6).map(p=>`<div class="row between"><span>${esc(p.name)}</span><span class="pill ${stockOf(p.id)<=0?'p-bad':'p-warn'} num">Còn ${stockOf(p.id)}</span></div>`).join('')+(low.length>6?`<div class="small muted">và ${low.length-6} sản phẩm khác</div>`:''):'<div class="muted">Tồn kho đều trên mức tối thiểu.</div>'}</div></div>
    </div>
  </div>`;
}
function topProducts(os){const m={};os.forEach(o=>(o.items||[]).forEach(i=>{m[i.id]=m[i.id]||{name:PM[i.id]?PM[i.id].name:i.name,qty:0,rev:0};m[i.id].qty+=i.qty;m[i.id].rev+=i.qty*i.price}));return Object.values(m).sort((a,b)=>b.qty-a.qty)}
function hbar(lab,v,max,txt){return `<div class="hbar"><span class="small" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(lab)}">${esc(lab)}</span><div class="track"><span style="width:${max?Math.max(2,v/max*100):0}%"></span></div><span class="small num muted">${txt}</span></div>`}
function niceMax(v){if(v<=0)return 1e6;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function barChart(ms){
  const W=560,H=230,L=46,B=26,T=18,R=8;const max=niceMax(Math.max(...ms.map(m=>m.v)));
  const bw=(W-L-R)/ms.length;const y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${tr(v)}</text>`}
  const bars=ms.map((m,i)=>{const x=L+i*bw+bw*.22,w=bw*.56,yy=y(m.v),last=i===ms.length-1;return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,H-B-yy)}" rx="4" fill="${last?'var(--gold)':'var(--wine)'}" opacity="${last?1:.85}"/>${m.v?`<text class="v" x="${x+w/2}" y="${yy-5}" text-anchor="middle">${tr(m.v)}</text>`:''}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${m.lab}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ doanh số 6 tháng">${g}${bars}</svg>`;
}

/* ---------- Đơn hàng ---------- */
function ordersTable(list,compact){
  if(!list.length)return `<div class="empty"><b>Chưa có đơn hàng</b>Tạo đơn đầu tiên ở mục Bán hàng.</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Mã đơn</th><th>Ngày</th><th>Khách / đối tác</th>${compact?'':'<th>Cấp giá</th><th class="r">SL</th>'}<th class="r">Thành tiền</th><th>Trạng thái</th>${compact?'':'<th>Thanh toán</th>'}</tr></thead><tbody>${list.map(o=>{
    const st=STATUS[o.status]||STATUS.cho;const due=o.total-(o.paid||0);const qty=(o.items||[]).reduce((a,i)=>a+i.qty,0);
    return `<tr class="click" data-act="viewOrder" data-id="${o.id}" data-fk="orders" data-s="${esc(sKey(o.code+' '+o.partnerName+' '+tierName(o.tier)))}"><td class="pname num">${esc(o.code)}${o.sample?' <span class="pill p-n">Mẫu</span>':''}</td><td class="num muted">${fdate(o.date)}</td><td>${esc(o.partnerName)}</td>${compact?'':`<td>${tierTag(o.tier)}</td><td class="r num">${qty}</td>`}<td class="r num money">${vnd(o.total)}</td><td><span class="pill ${st[1]}">${st[0]}</span></td>${compact?'':`<td>${o.status==='huy'?'<span class="muted">—</span>':due>0?`<span class="pill p-bad num">Nợ ${tr(due)}</span>`:'<span class="pill p-ok">Đã thu đủ</span>'}</td>`}</tr>`}).join('')}</tbody></table></div>`;
}
function vOrders(){
  const f=UI.seg.orders||'all';
  let list=ordersArr();
  if(f==='no')list=list.filter(o=>active(o)&&o.total>(o.paid||0));else if(f!=='all')list=list.filter(o=>o.status===f);
  const segs=[['all','Tất cả'],['cho','Chờ xử lý'],['giao','Đang giao'],['xong','Hoàn thành'],['no','Còn nợ'],['huy','Đã huỷ']];
  const tot=list.filter(active).reduce((a,o)=>a+o.total,0);
  return head('Đơn hàng',`${list.length} đơn · tổng ${vnd(tot)}`,`<button class="btn" data-act="exportOrders">Xuất Excel (CSV)</button><a class="btn pri" href="#ban-hang" data-go="ban-hang">+ Tạo đơn</a>`)+
  `<div class="panel"><div class="panel-h"><div class="tools" style="flex:1">${searchBox('orders','Tìm mã đơn, tên đối tác…')}<div class="seg">${segs.map(([k,n])=>`<button data-act="seg" data-k="orders" data-v="${k}" class="${f===k?'on':''}">${n}</button>`).join('')}</div></div></div>${ordersTable(list)}</div>`;
}
function orderDetail(id){
  const o={id,...S.orders[id]};const st=STATUS[o.status]||STATUS.cho;const due=o.total-(o.paid||0);const p=S.partners[o.partnerId];

function cartInfo(){
  const c=UI.cart;const tier=c.tier||'le';const p=tier!=='le'&&c.pid&&S.partners[c.pid]&&S.partners[c.pid].tier===tier?S.partners[c.pid]:null;
  const lines=Object.entries(c.items).filter(([,q])=>q>0).map(([id,q])=>({id,qty:q,price:price(id,tier),retail:price(id,'le')}));
  const total=lines.reduce((a,l)=>a+l.qty*l.price,0);const retail=lines.reduce((a,l)=>a+l.qty*l.retail,0);
  const prior=p?ordersArr().filter(o=>o.partnerId===c.pid&&active(o)).length:0;
  return {p,tier,lines,total,retail,seq:prior+1,qty:lines.reduce((a,l)=>a+l.qty,0)};
}

/* ---------- Khách hàng đã mua ---------- */
function buyers(){
  const m={};
  ordersArr().filter(active).forEach(o=>{
    const p=o.partnerId&&o.partnerId!=='le'?S.partners[o.partnerId]:null;
    const ph=digits(o.custPhone);
    const key=p?'p:'+o.partnerId:ph?'ph:'+ph:'n:'+sKey(o.custName||o.partnerName)+':'+o.tier;
    const b=m[key]||(m[key]={key,pid:p?o.partnerId:'',name:'',phone:'',address:'',tier:o.tier,orders:[],total:0,debt:0,qty:0,prods:{}});
    b.orders.push(o);b.total+=o.total;b.debt+=Math.max(0,o.total-(o.paid||0));
    if(!b.name)b.name=p?p.name:(o.custName||o.partnerName);
    if(!b.phone)b.phone=o.custPhone||(p&&p.phone)||'';
    if(!b.address)b.address=o.custAddress||(p&&p.address)||'';
    (o.items||[]).forEach(i=>{b.qty+=i.qty;b.prods[i.id]=(b.prods[i.id]||0)+i.qty});
  });
  return Object.values(m).map(b=>{b.last=b.orders[0].date;b.first=b.orders[b.orders.length-1].date;b.tier=b.orders[0].tier;b.top=Object.entries(b.prods).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([id])=>PM[id]?PM[id].name:id);return b});
}
function vBuyers(){
  const f=UI.seg.buy||'all',srt=UI.seg.bsort||'last';

  list.sort(srt==='total'?(a,b)=>b.total-a.total:srt==='count'?(a,b)=>b.orders.length-a.orders.length:(a,b)=>b.last.localeCompare(a.last));
  UI.buyers=Object.fromEntries(list.map(b=>[b.key,b]));
  const segs=[['all','Tất cả'],...TIERS.map(t=>[t.k,t.name]),['no','Còn nợ']];
  const sum=list.reduce((a,b)=>a+b.total,0);

  ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Khách hàng</th><th>Địa chỉ</th><th>Loại khách</th><th class="r">Số đơn</th><th class="r">Tổng đã mua</th><th class="r">Còn nợ</th><th class="r">Mua gần nhất</th></tr></thead><tbody>${list.map(b=>`<tr class="click" data-act="viewBuyer" data-id="${esc(b.key)}" data-fk="buyers" data-s="${esc(sKey([b.name,b.phone,b.address].join(' ')))}"><td><div class="pname">${esc(b.name)}</div><div class="small muted num">${esc(b.phone||'Chưa có SĐT')}</div></td><td class="small" style="max-width:240px">${esc(b.address||'—')}</td><td>${tierTag(b.tier)}</td><td class="r num">${b.orders.length}</td><td class="r num money">${vnd(b.total)}</td><td class="r num">${b.debt>0?`<span class="down">${vnd(b.debt)}</span>`:'<span class="muted">0</span>'}</td><td class="r num muted">${fdate(b.last)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Chưa có khách nào${f!=='all'?' trong nhóm này':''}</b>Khách sẽ hiện ở đây sau khi có đơn hàng.</div>`}</div>`;

function vReport(){

  const os=ordersArr().filter(o=>active(o)&&o.date>=since);
  const rev=os.reduce((a,o)=>a+o.total,0);const retail=os.reduce((a,o)=>a+(o.items||[]).reduce((b,i)=>b+i.qty*price(i.id,'le'),0),0);
  const byTier=TIERS.map(t=>({n:t.name,v:os.filter(o=>o.tier===t.k).reduce((a,o)=>a+o.total,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const tp=topProducts(os).sort((a,b)=>b.rev-a.rev);
  const byP={};os.forEach(o=>{byP[o.partnerName]=(byP[o.partnerName]||0)+o.total});const pr=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const ms=lastMonths(per==='all'||per==='6'?6:per==='3'?3:2).map(m=>({...m,v:os.filter(o=>monthKey(o.date)===m.k).reduce((a,o)=>a+o.total,0)}));

  `<div class="grid g-kpi"><div class="panel kpi gold"><div class="lab">Doanh thu</div><div class="val num">${tr(rev)}</div></div><div class="panel kpi"><div class="lab">Số đơn</div><div class="val num">${os.length}</div></div><div class="panel kpi"><div class="lab">Giá trị đơn trung bình</div><div class="val num">${tr(os.length?rev/os.length:0)}</div></div><div class="panel kpi"><div class="lab">Chiết khấu cho hệ thống</div><div class="val num">${tr(retail-rev)}</div><div class="sub">${retail?Math.round((retail-rev)/retail*100):0}% so với giá lẻ</div></div></div>
  <div class="grid g-2" style="margin-top:16px"><div class="panel"><div class="panel-h"><h2>Doanh thu theo tháng</h2></div><div class="panel-b">${barChart(ms)}</div></div>
  <div class="panel"><div class="panel-h"><h2>Theo cấp đối tác</h2></div><div class="panel-b">${byTier.length?byTier.map(x=>hbar(x.n,x.v,byTier[0].v,tr(x.v))).join(''):'<div class="muted">Chưa có dữ liệu.</div>'}</div></div></div>
  <div class="grid g-2e" style="margin-top:16px"><div class="panel"><div class="panel-h"><h2>Sản phẩm theo doanh thu</h2></div>${tp.length?`<div class="tbl-wrap"><table><thead><tr><th>Sản phẩm</th><th class="r">SL</th><th class="r">Doanh thu</th></tr></thead><tbody>${tp.slice(0,12).map(t=>`<tr><td>${esc(t.name)}</td><td class="r num">${t.qty}</td><td class="r num money">${vnd(t.rev)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có dữ liệu.</div>'}</div>
  <div class="panel"><div class="panel-h"><h2>Khách hàng / đối tác lớn nhất</h2></div><div class="panel-b">${pr.length?pr.map(([n,v])=>hbar(n,v,pr[0][1],tr(v))).join(''):'<div class="muted">Chưa có dữ liệu.</div>'}</div></div></div>`;
}

/* ===================== HÀNH ĐỘNG ===================== */
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="modal" data-act="backdrop">${html}</div>`;m.hidden=false;const f=m.querySelector('input,select');if(f)f.focus()}
function closeModal(){const m=document.getElementById('modal');m.hidden=true;m.innerHTML=''}
async function safe(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){toast(e&&e.code==='invalid_argument'?'Bạn không có quyền sửa dữ liệu này.':'Không lưu được: '+(e&&e.message||e))}}
async function adjStock(changes,extra){ // changes {pid:delta}
  for(const [pid,d] of Object.entries(changes)){const cur=S.inventory[pid]||{min:20};const n={...cur,qty:(+cur.qty||0)+d,...(extra||{})};if(d>0&&extra)n.sample=false;await put('inventory',pid,n)}
}
function go(r){route=r;try{history.replaceState(null,'','#'+r)}catch(e){}render();window.scrollTo(0,0)}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act],[data-go]');if(!el)return;
  if(el.dataset.go){e.preventDefault();return go(el.dataset.go)}
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='backdrop'){if(e.target===el)closeModal();return}
  if(['pickPartner','cartPaid','setQty','cartNote','cartPart','restoreFile'].includes(a))return;
  const c=UI.cart;
  switch(a){
   case 'close':closeModal();break;
   case 'backupNow':backupNow();break;
   case 'doRestore':doRestore();break;
   case 'seg':UI.seg[el.dataset.k]=el.dataset.v;render();break;
   case 'ptab':UI.ptab=el.dataset.v;render();break;
   case 'add':c.items[id]=(c.items[id]||0)+1;render();break;
   case 'inc':c.items[id]=(c.items[id]||0)+1;render();break;
   case 'dec':c.items[id]=Math.max(0,(c.items[id]||0)-1);if(!c.items[id])delete c.items[id];render();break;
   case 'clearCart':c.items={};render();break;
   case 'saleTier':if(c.tier!==el.dataset.v){if(c.pid)c.cust={name:'',phone:'',address:''};c.tier=el.dataset.v;c.pid='';}render();break;
   case 'newPartnerSale':openModal(partnerForm('',c.tier,c.cust.name,c.cust));break;
   case 'pickCust':pickCust(el.dataset.k,id);break;
   case 'viewBuyer':openModal(buyerDetail(id));break;
   case 'exportBuyers':exportBuyers();break;
   case 'sellBuyer':{const b=UI.buyers[id];closeModal();if(b.pid)pickCust('p',b.pid);else{UI.cart.tier=b.tier;UI.cart.pid='';UI.cart.cust={name:b.name==='Khách lẻ'?'':b.name,phone:b.phone,address:b.address}}go('ban-hang');break}
   case 'pickCustSell':pickCust('c',id);go('ban-hang');break;
   case 'askDelCust':openModal(`<div class="modal-box"><div class="modal-h"><h3>Xoá khách đã lưu?</h3></div><div class="modal-b">Xoá <b>${esc(S.customers[id].name||S.customers[id].phone)}</b> khỏi danh sách tự điền. Các đơn hàng cũ không bị ảnh hưởng.</div><div class="modal-f"><button class="btn" data-act="close">Không xoá</button><button class="btn pri" data-act="delCust" data-id="${id}">Xoá</button></div></div>`);break;
   case 'delCust':closeModal();await safe(()=>del('customers',id),'Đã xoá khách');break;
   case 'checkout':checkout();break;
   case 'newPartner':openModal(partnerForm());break;
   case 'editPartner':openModal(partnerForm(id));break;
   case 'viewPartner':openModal(partnerDetail(id));break;
   case 'sellTo':closeModal();pickCust('p',id);go('ban-hang');break;
   case 'askDelPartner':{const n=partnersArr().find(p=>p.id===id);const cnt=partnerStats(id).count;openModal(`<div class="modal-box"><div class="modal-h"><h3>Xoá đối tác?</h3></div><div class="modal-b">Xoá <b>${esc(n.name)}</b> khỏi danh sách. ${cnt?`${cnt} đơn hàng cũ vẫn được giữ lại trong báo cáo.`:''}</div><div class="modal-f"><button class="btn" data-act="close">Không xoá</button><button class="btn pri" data-act="delPartner" data-id="${id}">Xoá đối tác</button></div></div>`);break}
   case 'delPartner':closeModal();await safe(()=>del('partners',id),'Đã xoá đối tác');break;
   case 'viewOrder':openModal(orderDetail(id));break;
   case 'setStatus':await safe(()=>put('orders',id,{...S.orders[id],status:el.dataset.v}),'Đã cập nhật trạng thái');openModal(orderDetail(id));break;
   case 'cancelOrder':{const o=S.orders[id];await safe(async()=>{await put('orders',id,{...o,status:'huy'});const ch={};(o.items||[]).forEach(i=>ch[i.id]=(ch[i.id]||0)+i.qty);await adjStock(ch)},'Đã huỷ đơn, hàng đã về kho');openModal(orderDetail(id));break}
   case 'deleteOrder':closeModal();await safe(()=>del('orders',id),'Đã xoá đơn');break;
   case 'pay':case 'payFull':{const o=S.orders[id];const due=o.total-(o.paid||0);let amt=a==='payFull'?due:+(document.getElementById('payAmt').value||0);if(!(amt>0)){toast('Nhập số tiền đã thu');break}await safe(()=>put('orders',id,{...o,paid:Math.min(o.total,(o.paid||0)+amt)}),'Đã ghi nhận '+vnd(amt));openModal(orderDetail(id));break}
   case 'dlInvoice':dlInvoice(id);break;
   case 'stockIn':openModal(stockForm(id||PRODUCTS[0].id));break;
   case 'exportOrders':exportOrders();break;
   case 'exportPrices':exportPrices();break;
   case 'clearSample':openModal(`<div class="modal-box"><div class="modal-h"><h3>Xoá dữ liệu mẫu?</h3></div><div class="modal-b">Xoá các đối tác và đơn hàng có nhãn “Mẫu”, đưa tồn kho mẫu về 0. Dữ liệu chị tự nhập không bị ảnh hưởng.</div><div class="modal-f"><button class="btn" data-act="close">Giữ lại</button><button class="btn pri" data-act="doClearSample">Xoá dữ liệu mẫu</button></div></div>`);break;
   case 'doClearSample':closeModal();await safe(async()=>{for(const [k,o] of Object.entries(S.orders))if(o.sample)await del('orders',k);for(const [k,p] of Object.entries(S.partners))if(p.sample)await del('partners',k);for(const [k,v] of Object.entries(S.inventory))if(v.sample)await put('inventory',k,{...v,qty:0,sample:false,lastIn:'',lastQty:0})},'Đã xoá dữ liệu mẫu');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){UI.q[t.dataset.filter]=t.value;applyFilter(t.dataset.filter,t.value)}
  if(t.dataset.act==='cartNote')UI.cart.note=t.value;
  if(t.dataset.act==='cust'){UI.cart.cust[t.dataset.f]=t.value;if(t.dataset.f!=='address')showSug(t.value)}
  if(t.dataset.act==='cartPart')UI.cart.part=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='pickPartner'){if(t.value)pickCust('p',t.value);else{UI.cart.pid='';UI.cart.cust={name:'',phone:'',address:''};render()}}
  if(a==='cust'&&t.dataset.f==='phone'){const m=custMatches(t.value,true);if(m.length===1&&!UI.cart.cust.name)pickCust(m[0].k,m[0].id)}
  if(a==='cartPaid'){UI.cart.paid=t.value;render()}
  if(a==='bsort'){UI.seg.bsort=t.value;render()}
  if(a==='setQty'){const q=Math.max(0,parseInt(t.value)||0);if(q)UI.cart.items[t.dataset.id]=q;else delete UI.cart.items[t.dataset.id];render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal()});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());
  if(f.dataset.form==='partner'){
    if(!fd.name.trim())return toast('Nhập tên đối tác');
    const id=f.dataset.id||uid('p');const old=S.partners[id]||{};
    if(f.dataset.sale){UI.cart.tier=fd.tier;UI.cart.pid=id;UI.cart.cust={name:fd.name.trim(),phone:fd.phone||'',address:fd.address||''}}
    closeModal();await safe(()=>put('partners',id,{...old,...fd,name:fd.name.trim()}),f.dataset.id?'Đã lưu đối tác':'Đã thêm '+fd.name.trim());
  }
  if(f.dataset.form==='stock'){
    const q=parseInt(fd.qty)||0;if(q<=0)return toast('Số lượng phải lớn hơn 0');
    closeModal();
    await safe(async()=>{const cur=S.inventory[fd.pid]||{};await put('inventory',fd.pid,{...cur,qty:(+cur.qty||0)+q,min:+fd.min||20,lastIn:today().toISOString(),lastQty:q,sample:false})},`Đã nhập ${q} ${PM[fd.pid].name}`);
  }
});

const digits=s=>String(s||'').replace(/\D/g,'');
function custMatches(q,exactPhone){
  const d=digits(q),k=sKey(q).trim();if(!exactPhone&&d.length<3&&k.length<2)return[];
  const all=[...partnersArr().map(p=>({k:'p',id:p.id,name:p.name,phone:p.phone||'',address:p.address||'',tier:p.tier})),...Object.entries(S.customers).map(([id,c])=>({k:'c',id,...c}))];
  return all.filter(x=>exactPhone?(d.length>=9&&digits(x.phone)===d):((d.length>=3&&digits(x.phone).includes(d))||(k.length>=2&&isNaN(+k.replace(/\s/g,''))&&sKey(x.name).includes(k)))).slice(0,6);
}
function showSug(q){
  const box=document.getElementById('custSug');if(!box)return;const m=custMatches(q);
  if(!m.length){box.hidden=true;box.innerHTML='';return}
  box.innerHTML=m.map(x=>`<button type="button" data-act="pickCust" data-k="${x.k}" data-id="${esc(x.id)}"><span class="s1">${esc(x.name||'(chưa có tên)')} · <span class="num">${esc(x.phone||'')}</span></span><span class="s2">${esc(tierName(x.tier||'le'))}${x.address?' · '+esc(x.address):''}</span></button>`).join('');box.hidden=false;
}
function pickCust(k,id){
  const c=UI.cart;
  if(k==='p'){const p=S.partners[id];if(!p)return;c.tier=p.tier;c.pid=id;c.cust={name:p.name||'',phone:p.phone||'',address:p.address||''}}
  else{const x=S.customers[id];if(!x)return;c.tier=x.tier||'le';c.pid='';c.cust={name:x.name||'',phone:x.phone||'',address:x.address||''}}
  render();
}
async function rememberCust(ci,cu,d){
  if(ci.p){const p=S.partners[UI.cart.pid];if(p&&((!p.phone&&cu.phone)||(!p.address&&cu.address)))await put('partners',UI.cart.pid,{...p,phone:p.phone||cu.phone,address:p.address||cu.address});return}
  if(!cu.name&&!cu.phone)return;
  const dg=digits(cu.phone);
  let id=dg?'c'+dg:(Object.entries(S.customers).find(([,x])=>sKey(x.name)===sKey(cu.name))||[])[0]||uid('c');
  const old=S.customers[id]||{};
  await put('customers',id,{name:cu.name||old.name||'',phone:cu.phone||old.phone||'',address:cu.address||old.address||'',tier:ci.tier,lastOrder:d.toISOString(),count:(old.count||0)+1});
}
async function checkout(){
  const ci=cartInfo();if(!ci.lines.length)return;
  const short=ci.lines.filter(l=>stockOf(l.id)<l.qty);
  if(short.length&&!checkout.force){
    openModal(`<div class="modal-box"><div class="modal-h"><h3>Không đủ hàng trong kho</h3></div><div class="modal-b stack">${short.map(l=>`<div class="row between"><span>${esc(PM[l.id].name)}</span><span class="pill p-bad">Cần ${l.qty} · còn ${stockOf(l.id)}</span></div>`).join('')}<div class="small muted">Vẫn tạo đơn được, tồn kho sẽ bị âm cho đến khi nhập thêm hàng.</div></div><div class="modal-f"><button class="btn" data-act="close">Quay lại sửa</button><button class="btn pri" id="forceCo">Vẫn tạo đơn</button></div></div>`);
    document.getElementById('forceCo').onclick=()=>{closeModal();checkout.force=true;checkout().finally(()=>checkout.force=false)};
    return;
  }
  const t=TIERS[TI[ci.tier]];
  const paid=UI.cart.paid==='du'?ci.total:UI.cart.paid==='no'?0:Math.min(ci.total,+UI.cart.part||0);
  const cu={name:UI.cart.cust.name.trim(),phone:UI.cart.cust.phone.trim(),address:UI.cart.cust.address.trim()};
  const d=today();
  const code='TT'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const order={code,date:d.toISOString(),partnerId:ci.p?UI.cart.pid:(ci.tier==='le'?'le':''),partnerName:ci.p?ci.p.name:(cu.name||(ci.tier==='le'?'Khách lẻ':'Khách '+tierName(ci.tier))),custName:cu.name,custPhone:cu.phone,custAddress:cu.address,tier:ci.tier,
    items:ci.lines.map(l=>({id:l.id,name:PM[l.id].name,qty:l.qty,price:l.price})),total:ci.total,paid,status:'cho',seq:ci.seq,
    ship:(ci.p&&ci.seq>1&&t.next&&ci.total<t.next)?'doitac':'cty',note:UI.cart.note||''};
  const id=uid('o');
  await safe(async()=>{await put('orders',id,order);const ch={};ci.lines.forEach(l=>ch[l.id]=-l.qty);await adjStock(ch);await rememberCust(ci,cu,d)},'Đã tạo đơn '+code);
  UI.cart={pid:UI.cart.pid,tier:UI.cart.tier,items:{},paid:'du',note:'',cust:ci.p?{...UI.cart.cust}:{name:'',phone:'',address:''}};
  render();openModal(orderDetail(id));
}

/* ---------- Xuất file ---------- */
async function saveFile(name,data,type){
  type=type||(name.endsWith('.csv')?'text/csv':name.endsWith('.json')?'application/json':'text/html');
  const blob=new Blob([data],{type:type+';charset=utf-8'});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});return true;
    }
  }catch(e){if(e&&e.name==='AbortError')return false}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    toast('Đã tải '+name);return true;
  }catch(e){toast('Không tải được file');return false}
}
const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function exportOrders(){
  const rows=[['Mã đơn','Ngày','Đối tác','Cấp giá','Sản phẩm','SL','Đơn giá','Thành tiền','Tổng đơn','Đã thu','Trạng thái','Phí ship','Ghi chú']];
  ordersArr().forEach(o=>(o.items||[]).forEach((i,k)=>rows.push([o.code,fdate(o.date),o.partnerName,tierName(o.tier),PM[i.id]?PM[i.id].name:i.name,i.qty,i.price,i.qty*i.price,k?'':o.total,k?'':(o.paid||0),(STATUS[o.status]||[''])[0],o.ship==='doitac'?'Đối tác trả':'Công ty trả',k?'':o.note])));
  saveFile('don-hang-tuy-tam-'+today().toISOString().slice(0,10)+'.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));
}
function exportPrices(){
  const rows=[['STT','Tên hàng','Dung tích',...TIERS.map(t=>t.col),'Tồn kho']];
  PRODUCTS.forEach(p=>rows.push([p.stt,p.name,p.size,...p.p,stockOf(p.id)]));
  saveFile('bang-gia-tuy-tam-2026-2027.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));
}

  <div class="top"><div><h1>TÙY TÂM PHARMA</h1><div>PHIẾU XUẤT HÀNG</div></div><div class="r">Số: <b>${esc(o.code)}</b><br>Ngày: ${fdate(o.date)}</div></div>
  <p>Khách hàng: <b>${esc(o.custName||o.partnerName)}</b> (${tierName(o.tier)})<br>Điện thoại: ${esc(o.custPhone||p.phone||'')}<br>Địa chỉ: ${esc(o.custAddress||p.address||'')}<br>Phí vận chuyển: ${o.ship==='doitac'?'Đối tác tự thanh toán':'Công ty chi trả'}</p>
  <table><tr><th>STT</th><th>Tên hàng</th><th>ĐVT</th><th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr>${(o.items||[]).map((i,k)=>`<tr><td>${k+1}</td><td>${esc(PM[i.id]?PM[i.id].name:i.name)}</td><td>${esc(PM[i.id]?PM[i.id].size:'')}</td><td class="r">${i.qty}</td><td class="r">${nf(i.price)}</td><td class="r">${nf(i.qty*i.price)}</td></tr>`).join('')}
  <tr><td colspan="5" class="r"><b>Tổng cộng</b></td><td class="r"><b>${nf(o.total)}</b></td></tr><tr><td colspan="5" class="r">Đã thanh toán</td><td class="r">${nf(o.paid||0)}</td></tr><tr><td colspan="5" class="r">Còn lại</td><td class="r">${nf(Math.max(0,o.total-(o.paid||0)))}</td></tr></table>

  saveFile('phieu-xuat-'+o.code+'.html',html);

/* ===================== SAO LƯU ===================== */
const BK_KEY='tuytam-last-backup';
function lastBackup(){try{return localStorage.getItem(BK_KEY)||''}catch(e){return ''}}
function dataCount(){return Object.keys(S.orders).length+Object.keys(S.partners).length+Object.keys(S.customers).length}
function daysSince(iso){return iso?Math.floor((Date.now()-new Date(iso).getTime())/864e5):Infinity}
function backupNag(){
  if(!dataCount())return '';
  const d=daysSince(lastBackup());if(d<7)return '';
  return `<div class="banner"><span><b>${d===Infinity?'Chị chưa sao lưu dữ liệu lần nào.':'Đã '+d+' ngày chưa sao lưu.'}</b> Sao lưu để không mất dữ liệu khi đổi hoặc mất điện thoại.</span><button class="btn sm pri" data-act="backupNow">Sao lưu ngay</button></div>`;
}
function vBackup(){
  const lb=lastBackup();
  const n=[['Đơn hàng',Object.keys(S.orders).length],['Đối tác',Object.keys(S.partners).length],['Khách hàng',Object.keys(S.customers).length],['Mặt hàng có tồn kho',Object.keys(S.inventory).length]];
  return head('Sao lưu & chuyển dữ liệu','Dữ liệu được lưu ngay trên điện thoại này, dùng được khi không có mạng')+
  `<div class="grid g-2e">
    <div class="panel"><div class="panel-h"><h2>1. Sao lưu dữ liệu</h2></div><div class="panel-b bk-card">
      <div class="small muted">Lần sao lưu gần nhất: <b style="color:var(--ink)">${lb?new Date(lb).toLocaleString('vi-VN'):'chưa có'}</b></div>
      <dl class="kv">${n.map(([k,v])=>`<dt>${k}</dt><dd class="num">${v}</dd>`).join('')}</dl>
      <button class="btn pri bk-big" data-act="backupNow">Sao lưu ngay</button>
      <div class="note info"><span>Bấm Sao lưu ngay, rồi chọn <b>Lưu vào Tệp</b> (iCloud Drive) hoặc gửi qua <b>Zalo</b> cho chính mình. Nên làm mỗi tuần một lần.</span></div>
    </div></div>
    <div class="panel"><div class="panel-h"><h2>2. Khôi phục từ tệp sao lưu</h2></div><div class="panel-b bk-card">
      <div class="small muted">Dùng khi đổi điện thoại, lỡ xoá app, hoặc chuyển dữ liệu từ bản trên máy tính sang. Chọn tệp có tên bắt đầu bằng <b>tuy-tam-sao-luu</b>.</div>
      <label class="btn bk-big" style="cursor:pointer">Chọn tệp sao lưu…<input type="file" accept=".json,application/json" data-act="restoreFile" hidden></label>
      <div class="note warn"><span>Khôi phục sẽ thay toàn bộ dữ liệu đang có trên máy này bằng dữ liệu trong tệp.</span></div>
    </div></div>
  </div>`;
}
async function backupNow(){
  const d=today();const stamp=d.toISOString().slice(0,10);
  const data=JSON.stringify({app:'tuy-tam-sales',version:1,exportedAt:new Date().toISOString(),partners:S.partners,orders:S.orders,inventory:S.inventory,customers:S.customers});
  const ok=await saveFile('tuy-tam-sao-luu-'+stamp+'.json',data,'application/json');
  if(ok){try{localStorage.setItem(BK_KEY,new Date().toISOString())}catch(e){}render()}
}
let pendingRestore=null;
async function restoreFromFile(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||d.app!=='tuy-tam-sales')throw new Error('bad');
    pendingRestore=d;
    const c=[Object.keys(d.orders||{}).length,Object.keys(d.partners||{}).length,Object.keys(d.customers||{}).length];
    openModal(`<div class="modal-box"><div class="modal-h"><h3>Khôi phục dữ liệu?</h3></div><div class="modal-b stack">
      <div>Tệp sao lưu ngày <b>${new Date(d.exportedAt).toLocaleString('vi-VN')}</b> gồm <b>${c[0]}</b> đơn hàng, <b>${c[1]}</b> đối tác, <b>${c[2]}</b> khách hàng.</div>
      <div class="note warn">Dữ liệu hiện có trên máy này sẽ được thay bằng dữ liệu trong tệp.</div></div>
      <div class="modal-f"><button class="btn" data-act="close">Huỷ</button><button class="btn pri" data-act="doRestore">Khôi phục</button></div></div>`);
  }catch(e){toast('Tệp này không phải tệp sao lưu của Tùy Tâm Sales')}
}
function doRestore(){
  const d=pendingRestore;if(!d)return;
  S.partners=d.partners||{};S.orders=d.orders||{};S.inventory=d.inventory||{};S.customers=d.customers||{};
  saveLocal();pendingRestore=null;closeModal();toast('Đã khôi phục dữ liệu');go('tong-quan');
}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='restoreFile'&&t.files&&t.files[0]){restoreFromFile(t.files[0]);t.value=''}});
