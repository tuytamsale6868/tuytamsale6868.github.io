<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lớp học của tôi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lớp học">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F5B4B">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Ink-green chalkboard header, warm paper surface; gold is reserved for stars and praise */
:root{
  --bg:#F4F1EA;--surface:#FFFFFF;--surface-2:#F9F7F2;--ink:#1D2B27;--muted:#69756F;--line:#E4DED2;
  --pri:#1F5B4B;--pri-ink:#FFFFFF;--pri-soft:#E2EEE9;--board:#173F35;--board-ink:#EAF2EE;
  --star:#C98A0B;--star-soft:#FBF0D6;--warn:#B45309;--warn-soft:#FDEBD3;--bad:#B42318;--bad-soft:#FBE4E1;--ok:#2E7D4F;--ok-soft:#E1F2E7;
  --blue:#2D5C9A;--blue-soft:#E3ECF7;
  --shadow:0 1px 2px rgba(23,63,53,.06),0 4px 16px rgba(23,63,53,.06);
  --r:12px;--f:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;--fd:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--surface:#18201D;--surface-2:#1E2824;--ink:#E7EFEB;--muted:#93A39C;--line:#2B3833;
  --pri:#5FB596;--pri-ink:#0B1A15;--pri-soft:#1D3229;--board:#0C1513;--board-ink:#DDEBE5;
  --star:#F2B84B;--star-soft:#3A2D12;--warn:#F0A65A;--warn-soft:#3A2614;--bad:#F07A6E;--bad-soft:#3D1C19;--ok:#6CCB92;--ok-soft:#173022;
  --blue:#8DB4E8;--blue-soft:#1A2738;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715;--surface:#18201D;--surface-2:#1E2824;--ink:#E7EFEB;--muted:#93A39C;--line:#2B3833;
  --pri:#5FB596;--pri-ink:#0B1A15;--pri-soft:#1D3229;--board:#0C1513;--board-ink:#DDEBE5;
  --star:#F2B84B;--star-soft:#3A2D12;--warn:#F0A65A;--warn-soft:#3A2614;--bad:#F07A6E;--bad-soft:#3D1C19;--ok:#6CCB92;--ok-soft:#173022;
  --blue:#8DB4E8;--blue-soft:#1A2738;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--board);color:var(--board-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--fd);font-size:20px;margin:0;line-height:1.2;font-weight:700}
.top .sub{font-size:12.5px;opacity:.75}
.top .grow{flex:1;min-width:0}
.top .lockbtn{background:rgba(255,255,255,.1);border:0;color:var(--board-ink);border-radius:10px;padding:8px 10px;cursor:pointer}
.main{max-width:900px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;width:100%;max-width:640px}
.nav button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px;cursor:pointer;font-weight:500}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pri);font-weight:700}
/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15.5px;margin:0;font-weight:700}
.card-b{padding:12px 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%;padding:12px}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datebar .d{flex:1;text-align:center;font-weight:700}
.datebar .d small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:18px;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-star{background:var(--star-soft);color:var(--star)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-pri{background:var(--pri-soft);color:var(--pri)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-n{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--pri-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink)}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px}
textarea{resize:vertical;min-height:70px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-weight:500}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chip.on.w{background:var(--warn);border-color:var(--warn)}
.chip.on.b{background:var(--bad);border-color:var(--bad);color:#fff}
/* student grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.sc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 8px;text-align:center;cursor:pointer;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none}
.sc .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--pri-soft);color:var(--pri)}
.sc .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.sc .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sc .meta .s{color:var(--star);font-weight:700}.sc .meta .w{color:var(--warn);font-weight:700}
.sc.sel{border-color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.sc.sel::after{content:"✓";position:absolute;top:5px;right:7px;color:var(--pri);font-weight:800}
.sc.flag{border-color:var(--bad);background:var(--bad-soft)}
.sc.flag .av{background:var(--bad);color:#fff}
.sc.plus{border-color:var(--ok);background:var(--ok-soft)}
.sc.minus{border-color:var(--bad);background:var(--bad-soft)}
.sc .items{font-size:11.5px;color:var(--bad);line-height:1.25}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--pri-soft);color:var(--pri);flex:none;font-size:14px}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--pri)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:17px;flex:1;min-width:0;font-family:var(--fd)}
.sheet-b{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.rew{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rew button{border:1px solid var(--line);border-radius:12px;padding:12px 10px;background:var(--surface);text-align:left;font-weight:600;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--ink)}
.rew button .i{font-size:18px}
.rew.k button{background:var(--star-soft);border-color:transparent}
.rew.n button{background:var(--warn-soft);border-color:transparent}
.entry{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.entry:last-child{border-bottom:0}
.entry .grow{flex:1}
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;justify-content:center;padding:0 12px 10px}
.selbar-in{background:var(--board);color:var(--board-ink);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;width:100%;max-width:620px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.selbar-in .grow{flex:1;font-weight:600}
/* eval */
.ev-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ev-row:last-child{border-bottom:0}
.ev-row .lb{flex:1;min-width:130px;font-weight:600;font-size:14px}
.lv{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lv button{border:0;background:var(--surface);padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);min-width:44px}
.lv button+button{border-left:1px solid var(--line)}
.lv button.on.T{background:var(--ok);color:#fff}.lv button.on.H,.lv button.on.D{background:var(--pri);color:var(--pri-ink)}.lv button.on.C{background:var(--warn);color:#fff}
.score{width:64px!important;text-align:center;padding:7px!important}
.sec-t{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
.tbl{overflow-x:auto}
.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface-2);border:1px solid var(--line)}
.rank.r1{background:var(--star);color:#fff;border-color:var(--star)}
.gcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.gcard .tot{font-size:24px;font-weight:800}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;max-width:calc(100% - 32px);text-align:center}
/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--board);color:var(--board-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.lock h2{font-family:var(--fd);margin:0;font-size:22px}
.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--board-ink);display:block}.dots i.on{background:var(--board-ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--board-ink);font-size:26px;cursor:pointer}
.pad button.t{background:transparent;font-size:15px}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.hero{font-family:var(--fd);font-size:24px;margin:6px 0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="grow"><h1 id="tTitle">Lớp học của tôi</h1><div class="sub" id="tSub"></div></div><button class="lockbtn" id="lockBtn" data-a="lockNow" hidden aria-label="Khoá app">🔒</button></div></header>
<main class="main" id="main"></main>
<nav class="nav" id="nav"><div class="nav-in">
 <button data-go="homnay"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></svg>Hôm nay</button>
 <button data-go="thidua"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Thi đua</button>
 <button data-go="hocsinh"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.6 3.3-5.5 6.5-5.5s5.8 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Học sinh</button>
 <button data-go="danhgia"><svg viewBox="0 0 24 24"><path d="M7 3h10l3 4v14H4V7z"/><path d="M9 12l2 2 4-4M9 17h6"/></svg>Đánh giá</button>
 <button data-go="them"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Thêm</button>
</div></nav>
<div id="sheet" hidden></div>
<div id="selbar" hidden></div>
<div id="lock" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== DANH MỤC ===================== */
const KEY='lophoc-v1',BK_KEY='lophoc-last-backup';
const DEF_REW=['⭐ Phát biểu xây dựng bài','🤝 Giúp đỡ bạn','🙇 Lễ phép, ngoan ngoãn','📈 Có tiến bộ','✅ Hoàn thành bài tốt','🧹 Giữ gìn vệ sinh lớp'];
const DEF_WARN=['💬 Nói chuyện riêng','📕 Chưa làm bài','⏰ Đi học muộn','🙅 Chưa đoàn kết với bạn'];
const VS_ITEMS=[['qa','Quần áo chưa sạch'],['dt','Đầu tóc chưa gọn'],['mt','Móng tay dài, bẩn'],['tm','Tay chân, mặt chưa sạch'],['dp','Thiếu đồng phục, khăn quàng'],['rm','Chưa vệ sinh răng miệng'],['k','Khác']];
const SUBJ=[
 {k:'tv',n:'Tiếng Việt',g:[1,2,3,4,5],t:[1,2,3,4,5]},
 {k:'toan',n:'Toán',g:[1,2,3,4,5],t:[1,2,3,4,5]},
 {k:'ta',n:'Tiếng Anh',g:[3,4,5],t:[3,4,5],opt:[1,2]},
 {k:'dd',n:'Đạo đức',g:[1,2,3,4,5]},
 {k:'tnxh',n:'Tự nhiên và Xã hội',g:[1,2,3]},
 {k:'kh',n:'Khoa học',g:[4,5],t:[4,5]},
 {k:'lsdl',n:'Lịch sử và Địa lí',g:[4,5],t:[4,5]},
 {k:'thcn',n:'Tin học và Công nghệ',g:[3,4,5],t:[3,4,5]},
 {k:'gdtc',n:'Giáo dục thể chất',g:[1,2,3,4,5]},
 {k:'an',n:'Âm nhạc',g:[1,2,3,4,5]},
 {k:'mt',n:'Mĩ thuật',g:[1,2,3,4,5]},
 {k:'hdtn',n:'Hoạt động trải nghiệm',g:[1,2,3,4,5]}];
const NLC=[['tutu','Tự chủ và tự học'],['gt','Giao tiếp và hợp tác'],['gq','Giải quyết vấn đề và sáng tạo']];
const NLD=[['nn','Ngôn ngữ'],['tt','Tính toán'],['khh','Khoa học'],['cn','Công nghệ',3],['th','Tin học',3],['tm','Thẩm mĩ'],['tc','Thể chất']];
const PC=[['yn','Yêu nước'],['na','Nhân ái'],['cc','Chăm chỉ'],['tr','Trung thực'],['trn','Trách nhiệm']];
const PERIODS=[['gk1','Giữa HKI'],['ck1','Cuối HKI'],['gk2','Giữa HKII'],['cn','Cuối năm']];
const SUP_AREAS=['Đọc','Viết, chính tả','Tính toán','Tiếng Việt (HS dân tộc)','Chuyên cần','Sức khoẻ','Hoàn cảnh khó khăn','Tâm lí, hành vi','Kĩ năng tự phục vụ'];
const TAGS=['Dân tộc thiểu số','Hộ nghèo','Hộ cận nghèo','Khuyết tật','Mồ côi','Ở xa trường'];
const PROG_AREAS=['Học tập','Đọc, viết','Tính toán','Nề nếp, hành vi','Giao tiếp, tự tin','Năng khiếu','Rèn luyện thân thể','Khác'];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayS=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>{if(!s)return'';const d=parseD(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const fdShort=s=>{const d=parseD(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const WD=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const wdName=s=>WD[parseD(s).getDay()];
const monday=s=>{const d=parseD(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};
const weekNo=s=>Math.floor((parseD(monday(s))-parseD(monday(D.cfg.week1)))/6048e5)+1;
const sKey=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const words=n=>String(n||'').trim().split(/\s+/);
const given=n=>words(n).slice(-1)[0]||'';
const shortName=n=>{const w=words(n);return w.length>2?w.slice(-2).join(' '):w.join(' ')};
const initials=n=>{const w=words(n);return ((w.length>1?w[w.length-2][0]:'')+(w[w.length-1]||'?')[0]).toUpperCase()};
const digits=s=>String(s||'').replace(/\D/g,'');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function studs(filter){const coll=new Intl.Collator('vi');return Object.entries(D.students).map(([id,s])=>({id,...s})).filter(s=>s.active!==false).sort((a,b)=>coll.compare(given(a.name),given(b.name))||coll.compare(a.name,b.name)).filter(filter||(()=>true))}
const S=id=>D.students[id]||{};
const day=d=>D.days[d]||(D.days[d]={});
const multiGrade=()=>D.cfg.grades.length>1;
const gradeOf=s=>+(s.grade||D.cfg.grades[0]||1);

function parseList(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(line=>{
    let cols=line.split('\t').map(x=>x.trim()).filter((x,i)=>!(i===0&&/^\d+[.)]?$/.test(x)));
    if(!cols.length)return;
    let name=cols[0].replace(/^\d+[.)\-\s]+/,'').trim();if(!name||/^(họ|ho) ?(và)? ?tên/i.test(name))return;
    const s={name};
    cols.slice(1).forEach(x=>{if(/^(nam|nữ|nu)$/i.test(x))s.gender=/^nam$/i.test(x)?'Nam':'Nữ';else{const m=x.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)s.dob=m[3]+'-'+pad(m[2])+'-'+pad(m[1]);else if(/^[1-5]$/.test(x))s.grade=+x}});
    out.push(s);
  });return out;
}

}

function weekDays(mon){return Array.from({length:7},(_,i)=>addDays(mon,i))}
function weekStats(mon){
  const ds=weekDays(mon),set=new Set(ds),sc=D.cfg.sc,ss=studs();
  const per={};ss.forEach(s=>per[s.id]={k:0,n:0,vs:0,ldp:0,ldm:0});
  D.log.forEach(x=>{if(set.has(x.d)&&per[x.sid])per[x.sid][x.k==='k'?'k':'n']++});
  const truc={};ds.forEach(d=>{const v=D.days[d];if(!v)return;Object.entries(v.vs||{}).forEach(([sid,it])=>{if(it.length&&per[sid])per[sid].vs++});
    if(v.ld&&v.ld.on)Object.entries(v.ld.st||{}).forEach(([sid,x])=>{if(per[sid])per[sid][x==='+'?'ldp':'ldm']++});
    if(v.tr&&v.tr.g&&v.tr.res){(truc[v.tr.g]=truc[v.tr.g]||[]).push(v.tr.res)}});
  const W=D.weeks[mon]||{};const adj=W.adj||{};
  const groups=D.cfg.groups.map(g=>{const mem=ss.filter(s=>s.group===g);const t={g,mem:mem.length,k:0,n:0,vs:0,ldp:0,ldm:0};mem.forEach(s=>{for(const f of ['k','n','vs','ldp','ldm'])t[f]+=per[s.id][f]});
    const tr=truc[g]||[];t.trTot=tr.filter(x=>x==='tot').length;t.trChua=tr.filter(x=>x==='chua').length;t.trDat=tr.filter(x=>x==='dat').length;t.adj=+adj[g]||0;
    t.total=t.k*sc.khen-t.n*sc.nhac-t.vs*sc.vs+t.trTot*sc.trucTot-t.trChua*sc.trucChua+t.ldp*sc.ldTot-t.ldm*sc.ldVang+t.adj;return t});
  const ranked=[...groups].sort((a,b)=>b.total-a.total);let r=0,last=null;ranked.forEach((t,i)=>{if(t.total!==last){r=i+1;last=t.total}t.rank=r});
  return {groups,per,ds};
}

   <label class="f">Kế hoạch tuần tới<textarea data-a="wkf" data-f="kh" rows="3">${esc(W.kh||'')}</textarea></label></div></div>`;

function wkSuggest(){

  else{if(T.length)parts.push(`Em ${ten} hoàn thành tốt môn ${T.join(', ')}.`);else parts.push(`Em ${ten} hoàn thành các môn học.`);if(C.length)parts.push(`Cần cố gắng hơn ở môn ${C.join(', ')}.`)}
  const good=[],weak=[];
  [...NLC,...nldFor(s)].forEach(([k])=>{if(e.nl[k]==='T')good.push(PHRASE.nl.T[k]);if(e.nl[k]==='C')weak.push(PHRASE.nl.C[k])});
  PC.forEach(([k])=>{if(e.pc[k]==='T')good.push(PHRASE.pc.T[k]);if(e.pc[k]==='C')weak.push(PHRASE.pc.C[k])});
  if(good.length){const g=good.slice(0,4);parts.push('Em '+g.join(', ')+'.')}
  if(weak.length)parts.push(weak.slice(0,3).map((w,i)=>i?w:w[0].toUpperCase()+w.slice(1)).join('; ')+'.');
  if(!good.length&&!weak.length)parts.push('Em ngoan, lễ phép, biết vâng lời thầy cô.');
  e.cm=parts.join(' ');save();const ta=document.getElementById('evCm');if(ta)ta.value=e.cm;toast('Đã tạo nhận xét, thầy cô sửa lại cho sát với em');
}

  ${[...NLC.map(x=>['nl',...x]),...NLD.map(x=>['nl',x[0],x[1]]),...PC.map(x=>['pc',...x])].map(([kd,k,n])=>`<tr><td>${n}</td><td class="c num">${cnt(e=>e[kd][k],'T')}</td><td class="c num">${cnt(e=>e[kd][k],'D')}</td><td class="c num">${cnt(e=>e[kd][k],'C')}</td></tr>`).join('')}</tbody></table></div></div>`;

function xBuild(){
  const ss=studs(),out=[],cls=D.cfg.cls,rng=`Từ ${fd(UI.xFrom)} đến ${fd(UI.xTo)}`,sel=UI.xSel;
  const title=(n,sub)=>[[`${D.cfg.school.toUpperCase()} · LỚP ${cls} · NĂM HỌC ${D.cfg.year}`],[n+(sub?' — '+sub:'')],[]];
  const add=(name,head,rows,widths,sub)=>out.push({name,rows:[...title(name,sub),head,...rows],head:3,widths});
  if(sel.has('ds'))add('Danh sách học sinh',['STT','Họ và tên','Giới tính','Ngày sinh','Dân tộc',...(multiGrade()?['Khối']:[]),'Tổ','Địa chỉ','Phụ huynh','Quan hệ','Điện thoại','Điện thoại khác','Đặc điểm','Sức khoẻ, lưu ý','Cần quan tâm','Cần giúp đỡ','Ghi chú GVCN'],
    ss.map((s,i)=>[i+1,s.name,s.gender,fd(s.dob),s.ethnic,...(multiGrade()?[s.grade]:[]),s.group,s.address,s.parent,s.rel,s.phone,s.phone2,(s.tags||[]).join(', '),s.health,s.watch?'x':'',s.support&&s.support.on?'x':'',s.note]),[6,26,9,12,12,...(multiGrade()?[7]:[]),9,22,22,10,14,14,22,22,10,10,30]);
  const L=D.log.filter(x=>inR(x.d)&&D.students[x.sid]);
  const per={};ss.forEach(s=>per[s.id]={k:0,n:0,vs:0,lp:0,lm:0,tb:0});L.forEach(x=>per[x.sid][x.k==='k'?'k':'n']++);
  const dayList=Object.keys(D.days).filter(inR).sort();

  const el=e.target.closest('[data-a],[data-go]');if(!el)return;

  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  if(['restoreFile','xFrom','xTo','rwIn','rwNorm','rwDate','rwPick','q','trGroup','trNote','ldOn','ldTask','ldNote','wkf','evScore','evCm','grpName','dutySet','rewEdit','scSet','supOn','supPlan','tdDone'].includes(a))return;
  if(el.tagName==='A')e.preventDefault();
  switch(a){
   case 'bg':if(e.target===el)closeSheet();break;
   case 'close':closeSheet();render();break;
   case 'suGrade':{const g=+v;const c=(D||(D=blank())).cfg;c.grades=c.grades.includes(g)?c.grades.filter(x=>x!==g):[...c.grades,g].sort();el.classList.toggle('on');break}
   case 'suDone':{D=D||blank();const c=D.cfg;c.school=val('su-school');c.cls=val('su-cls');c.year=val('su-year');c.teacher=val('su-teacher');if(!c.cls){toast('Nhập tên lớp chủ nhiệm');return}if(!c.grades.length)c.grades=[1];addStudents(parseList(document.getElementById('su-list').value));save();UI.tab=studs().length?'homnay':'hocsinh';render();toast('Đã tạo lớp '+c.cls);break}
   case 'day':UI.date=addDays(UI.date,+v);clearSel();render();break;
   case 'dayToday':UI.date=todayS();render();break;
   case 'dsub':UI.dsub=v;clearSel();render();break;
   case 'selMode':UI.sel=UI.sel?null:new Set();render();renderSelbar();break;
   case 'selAll':studs().forEach(s=>UI.sel.add(s.id));render();renderSelbar();break;
   case 'khenTap':if(UI.sel){UI.sel.has(id)?UI.sel.delete(id):UI.sel.add(id);el.classList.toggle('sel');renderSelbar()}else{UI.sheet=()=>khenSheet(id);khenSheet(id)}break;
   case 'give':give([id],el.dataset.k,+v);toast(el.dataset.k==='k'?'⭐ Đã khen '+given(S(id).name):'Đã ghi nhắc nhở');khenSheet(id);render();break;
   case 'unGive':D.log=D.log.filter(x=>x.id!==id);save();khenSheet(el.dataset.sid);render();break;
   case 'selGive':{const k=el.dataset.k;const list=k==='k'?D.cfg.rewards:D.cfg.warns;openSheet(`<div class="sheet-h"><h3>${k==='k'?'Khen':'Nhắc nhở'} ${UI.sel.size} em</h3><button class="btn ghost sm" data-a="close">Huỷ</button></div><div class="sheet-b"><div class="rew ${k}">${list.map((r,i)=>`<button data-a="selGiveDo" data-k="${k}" data-v="${i}">${rewLabel(r)}</button>`).join('')}</div></div>`);break}
   case 'selGiveDo':give([...UI.sel],el.dataset.k,+v);toast(`Đã ghi cho ${UI.sel.size} em`);closeSheet();clearSel();render();break;
   case 'vsTap':UI.sheet=()=>vsSheet(id);vsSheet(id);break;
   case 'vsItem':{const dd=day(UI.date);dd.vs=dd.vs||{};const it=dd.vs[id]=dd.vs[id]||[];const i=it.indexOf(v);i>=0?it.splice(i,1):it.push(v);if(!it.length)delete dd.vs[id];dd.vsDone=true;save();vsSheet(id);render();break}
   case 'vsClear':{const dd=day(UI.date);if(dd.vs)delete dd.vs[id];dd.vsDone=true;save();closeSheet();render();break}
   case 'vsAllOk':day(UI.date).vsDone=true;save();render();toast('Đã ghi: cả lớp sạch sẽ');break;
   case 'trRes':{const dd=day(UI.date);dd.tr=dd.tr||{g:D.cfg.duty[parseD(UI.date).getDay()]||'',res:'',note:''};dd.tr.res=dd.tr.res===v?'':v;save();render();break}
   case 'ldRes':{const dd=day(UI.date);dd.ld.res=dd.ld.res===v?'':v;save();render();break}
   case 'ldTap':{const st=day(UI.date).ld.st=day(UI.date).ld.st||{};st[id]=st[id]==='+'?'-':st[id]==='-'?undefined:'+';if(!st[id])delete st[id];save();render();break}
   case 'wk':UI.week=addDays(UI.week,+v);render();break;
   case 'adj':{const W=D.weeks[UI.week]=D.weeks[UI.week]||{};W.adj=W.adj||{};W.adj[el.dataset.g]=(+W.adj[el.dataset.g]||0)+(+v);save();render();break}
   case 'wkSuggest':{const W=D.weeks[UI.week]||{};if((W.uu||W.ton||W.kh)&&!confirmBox('Thay nội dung sơ kết đang có bằng gợi ý mới?'))return;wkSuggest();break}
   case 'openMore':UI.tab='them';UI.them=v;render();window.scrollTo(0,0);break;
   case 'hsf':UI.hsf=v;render();break;
   case 'newStu':{const sid=uid('s');addStudents([{name:''}]);const k=Object.keys(D.students).pop();D.students[k].name='';save();UI.stuTab='hs';UI.sheet=()=>stuSheet(k);stuSheet(k,'hs');setTimeout(()=>{const i=document.querySelector('[data-sf=name]');if(i)i.focus()},50);break}
   case 'pasteList':openSheet(`<div class="sheet-h"><h3>Dán danh sách học sinh</h3><button class="btn ghost sm" data-a="close">Huỷ</button></div><div class="sheet-b stack"><div class="small muted">Mỗi em một dòng. Có thể sao chép nhiều cột từ Excel/vnEdu: Họ tên, Giới tính, Ngày sinh${multiGrade()?', Khối':''}.</div><textarea id="pl" rows="10"></textarea></div><div class="sheet-f"><button class="btn pri" data-a="pasteDo">Thêm vào lớp</button></div>`);break;
   case 'pasteDo':{const L=parseList(document.getElementById('pl').value);if(!L.length){toast('Chưa có tên nào');return}addStudents(L);save();closeSheet();render();toast(`Đã thêm ${L.length} học sinh`);break}
   case 'openStu':UI.stuTab='hs';UI.sheet=()=>stuSheet(id);stuSheet(id,'hs');break;
   case 'openStuLL':UI.stuTab='ll';UI.sheet=()=>stuSheet(id);stuSheet(id,'ll');break;
   case 'stuTab':UI.stuTab=v;stuSheet(id,v);break;
   case 'tag':{const s=S(id);s.tags=s.tags||[];const i=s.tags.indexOf(v);i>=0?s.tags.splice(i,1):s.tags.push(v);save();stuSheet(id);break}
   case 'askDelStu':openSheet(`<div class="sheet-h"><h3>Xoá học sinh?</h3></div><div class="sheet-b">Xoá <b>${esc(S(id).name)}</b> và toàn bộ ghi nhận của em (khen thưởng, đánh giá, liên lạc). Không hoàn tác được.</div><div class="sheet-f"><button class="btn" data-a="openStu" data-id="${id}">Không xoá</button><button class="btn pri" style="background:var(--bad);border-color:var(--bad)" data-a="delStu" data-id="${id}">Xoá</button></div>`);break;
   case 'delStu':delete D.students[id];D.log=D.log.filter(x=>x.sid!==id);D.progress=D.progress.filter(x=>x.sid!==id);D.rw=D.rw.filter(x=>x.sid!==id);D.notes.forEach(n=>{if(n.sid===id)n.sid=''});D.contacts=D.contacts.filter(x=>x.sid!==id);Object.values(D.evals).forEach(P=>delete P[id]);Object.values(D.days).forEach(v=>{if(v.vs)delete v.vs[id];if(v.ld&&v.ld.st)delete v.ld.st[id]});save();closeSheet();render();toast('Đã xoá');break;
   case 'supArea':{const sp=S(id).support;const i=sp.areas.indexOf(v);i>=0?sp.areas.splice(i,1):sp.areas.push(v);save();stuSheet(id);break}
   case 'supAdd':{const t=val('spT');if(!t){toast('Nhập nội dung ghi nhận');return}S(id).support.notes.push({id:uid('n'),d:val('spD')||todayS(),lv:val('spL'),t});save();stuSheet(id);toast('Đã ghi');break}
   case 'supDel':{const sp=S(id).support;sp.notes=sp.notes.filter(n=>n.id!==v);save();stuSheet(id);break}
   case 'ctAdd':{const t=val('ctT');if(!t){toast('Nhập nội dung trao đổi');return}D.contacts.push({id:uid('c'),sid:id,d:val('ctD')||todayS(),kind:val('ctK'),t,r:val('ctR')});save();stuSheet(id);toast('Đã lưu');break}
   case 'ctDel':D.contacts=D.contacts.filter(c=>c.id!==v);save();stuSheet(id);break;
   case 'period':UI.period=v;render();break;
   case 'evView':UI.evView=v;render();break;
   case 'openEv':UI.sheet=()=>evSheet(UI.evId);evSheet(id);break;
   case 'evNav':{const ss=studs();const n=+v;if(ss[n]){evSheet(ss[n].id);document.querySelector('.sheet-b').scrollTop=0}break}
   case 'evSet':{const e=evOf(UI.period,UI.evId);const kd=el.dataset.kind,c=el.dataset.code;if(kd==='m'){e.m[c]=e.m[c]||{};e.m[c].l=e.m[c].l===v?'':v}else{e[kd][c]=e[kd][c]===v?'':v}save();evSheet(UI.evId);break}
   case 'evFill':{const s=S(UI.evId),e=evOf(UI.period,UI.evId);subjFor(s).forEach(x=>{e.m[x.k]=e.m[x.k]||{};if(!e.m[x.k].l)e.m[x.k].l='H'});[...NLC,...nldFor(s)].forEach(([k])=>{if(!e.nl[k])e.nl[k]='D'});PC.forEach(([k])=>{if(!e.pc[k])e.pc[k]='D'});save();evSheet(UI.evId);toast('Đã điền các mục còn trống');break}
   case 'evGen':{const e=evOf(UI.period,UI.evId);if(e.cm.trim()&&!confirmBox('Thay nhận xét đang có bằng nhận xét tự tạo?'))return;evGen();break}
   case 'evBank':{const e=evOf(UI.period,UI.evId);const t=BANK[+v];e.cm=(e.cm.trim()?e.cm.trim()+' ':'')+t;save();const ta=document.getElementById('evCm');if(ta)ta.value=e.cm;break}
   case 'cfGrade':{const g=+v,c=D.cfg;const ng=c.grades.includes(g)?c.grades.filter(x=>x!==g):[...c.grades,g].sort();if(!ng.length){toast('Cần ít nhất một khối');return}c.grades=ng;save();render();break}
   case 'grpAdd':D.cfg.groups.push('Tổ '+(D.cfg.groups.length+1));save();render();break;
   case 'grpDel':{const g=D.cfg.groups[+v];if(!confirmBox('Xoá '+g+'? Các em trong tổ sẽ chưa có tổ.'))return;D.cfg.groups.splice(+v,1);studs().forEach(s=>{if(s.group===g)D.students[s.id].group=''});for(const w in D.cfg.duty)if(D.cfg.duty[w]===g)D.cfg.duty[w]='';save();render();break}
   case 'grpAuto':{if(!D.cfg.groups.length)return;if(!confirmBox('Chia lại toàn bộ học sinh vào '+D.cfg.groups.length+' tổ theo thứ tự danh sách?'))return;studs().forEach((s,i)=>D.students[s.id].group=D.cfg.groups[i%D.cfg.groups.length]);save();render();toast('Đã chia tổ');break}
   case 'tdAdd':{const t=val('tdT');if(!t)return;D.todos.push({id:uid('t'),t,due:val('tdD'),done:false});save();render();break}
   case 'tdDel':D.todos=D.todos.filter(x=>x.id!==v);save();render();break;
   case 'pinSet':{const p1=val('pin1'),p2=val('pin2');if(!/^\d{4,6}$/.test(p1)){toast('Mã PIN gồm 4–6 chữ số');return}if(p1!==p2){toast('Hai lần nhập không khớp');return}D.cfg.pin=await hashPin(p1);D.cfg.pinLen=p1.length;unlocked=true;save();render();toast('Đã bật mã PIN');break}
   case 'pinOff':if(!confirmBox('Tắt mã PIN?'))return;D.cfg.pin='';save();render();toast('Đã tắt mã PIN');break;
   case 'lockNow':showLock();break;
   case 'pin':pinPress(v);break;
   case 'pinBack':pinBuf=pinBuf.slice(0,-1);drawLock();break;
   case 'pinForgot':if(confirmBox('Quên mã PIN: toàn bộ dữ liệu trên máy sẽ bị xoá. Sau đó thầy cô khôi phục từ tệp sao lưu. Tiếp tục?')&&confirmBox('Chắc chắn xoá dữ liệu trên máy này?')){localStorage.removeItem(KEY);D=null;document.getElementById('lock').hidden=true;render()}break;
   case 'backupNow':backupNow();break;
   case 'noteNew':noteSheet('',null);break;
   case 'noteNewAny':noteSheet('',null);break;
   case 'noteNewFor':noteSheet('',id);break;
   case 'noteEdit':noteSheet(v);break;
   case 'noteSave':{const t=val('nT');if(!t){toast('Nhập nội dung ghi chú');return}if(v){const n=D.notes.find(x=>x.id===v);Object.assign(n,{d:val('nD')||todayS(),sid:val('nS'),t})}else D.notes.push({id:uid('g'),d:val('nD')||todayS(),sid:val('nS'),t});save();closeSheet();render();toast('Đã lưu ghi chú');break}
   case 'noteDel':if(!confirmBox('Xoá ghi chú này?'))return;D.notes=D.notes.filter(x=>x.id!==v);save();closeSheet();render();break;
   case 'progNew':progSheet(id||'');break;
   case 'progSave':{const t=val('pT');if(!t){toast('Nhập nội dung tiến bộ');return}D.progress.push({id:uid('p'),sid:val('pS'),d:val('pD')||todayS(),a:val('pA'),t});save();closeSheet();render();toast('🌟 Đã ghi tiến bộ');break}
   case 'progDel':D.progress=D.progress.filter(x=>x.id!==v);save();stuSheet(id);break;
   case 'openStuTB':UI.stuTab='tb';UI.sheet=()=>stuSheet(id);stuSheet(id,'tb');break;
   case 'xRange':{const r=xRange(v);UI.xFrom=r[0];UI.xTo=r[1];render();break}
   case 'xDo':doExport();break;
   case 'timer':timerLen=+v;timerEnd=0;clearInterval(timerI);timerI=null;timerSheet();break;
   case 'timerGo':if(timerEnd){clearInterval(timerI);timerI=null;timerEnd=0;timerSheet()}else{timerEnd=Date.now()+timerLen*1000;timerSheet();timerI=setInterval(timerTick,250)}break;
   case 'timerReset':clearInterval(timerI);timerI=null;timerEnd=0;timerSheet();break;
   case 'timerClose':clearInterval(timerI);timerI=null;timerEnd=0;closeSheet();break;
   case 'xSel':UI.xSel.has(v)?UI.xSel.delete(v):UI.xSel.add(v);el.classList.toggle('on');break;
   case 'doRestore':if(pendingRestore){D=pendingRestore;const b=blank();D.cfg={...b.cfg,...D.cfg,sc:{...b.cfg.sc,...(D.cfg.sc||{})}};save();pendingRestore=null;closeSheet();UI.tab='homnay';unlocked=true;render();toast('Đã khôi phục dữ liệu')}break;
  }
});
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function confirmBox(m){try{return window.confirm(m)}catch(e){return true}}
document.addEventListener('input',e=>{
  const t=e.target,a=t.dataset.a;
  if(t.dataset.sf){const sid=t.closest('[data-stu]').dataset.stu;const s=D.students[sid];if(!s)return;s[t.dataset.sf]=t.type==='checkbox'?t.checked:t.value;save();if(t.dataset.sf==='name'){const h=document.querySelector('.sheet-h h3');if(h)h.textContent=t.value||'Học sinh mới'}return}
  if(t.dataset.cf){D.cfg[t.dataset.cf]=t.type==='checkbox'?t.checked:t.value;save();if(t.dataset.cf==='cls'||t.dataset.cf==='teacher'||t.dataset.cf==='school')setTop('Lớp '+D.cfg.cls,(D.cfg.teacher?'GVCN '+D.cfg.teacher+' · ':'')+D.cfg.school);return}
  if(a==='q'){UI.q=t.value;UI.focusQ=true;render();return}
  if(a==='trNote'){const dd=day(UI.date);dd.tr=dd.tr||{g:D.cfg.duty[parseD(UI.date).getDay()]||'',res:'',note:''};dd.tr.note=t.value;save();return}
  if(a==='ldTask'){day(UI.date).ld.task=t.value;save();return}
  if(a==='ldNote'){day(UI.date).ld.note=t.value;save();return}
  if(a==='wkf'){const W=D.weeks[UI.week]=D.weeks[UI.week]||{};W[t.dataset.f]=t.value;save();return}
  if(a==='evScore'){const e=evOf(UI.period,UI.evId);const c=t.dataset.code;e.m[c]=e.m[c]||{};const n=t.value===''?null:Math.max(0,Math.min(10,+t.value));e.m[c].s=n;save();return}
  if(a==='evCm'){evOf(UI.period,UI.evId).cm=t.value;save();return}
  if(a==='grpName'){const i=+t.dataset.v,old=D.cfg.groups[i],nw=t.value;D.cfg.groups[i]=nw;Object.values(D.students).forEach(s=>{if(s.group===old)s.group=nw});for(const w in D.cfg.duty)if(D.cfg.duty[w]===old)D.cfg.duty[w]=nw;save();return}
  if(a==='rewEdit'){const L=t.value.split('\n').map(x=>x.trim()).filter(Boolean);if(L.length)D.cfg[t.dataset.v]=L;save();return}
  if(a==='scSet'){D.cfg.sc[t.dataset.v]=Math.max(0,+t.value||0);save();return}
  if(a==='supPlan'){S(t.dataset.id).support.plan=t.value;save();return}
  if(a==='rwIn'){const sid=t.dataset.id,k=t.dataset.k,d=UI.rwD||todayS();let e=rwOf(sid,d);if(!e){e={id:uid('r'),sid,d,r:null,w:null};D.rw.push(e)}e[k]=t.value===''?null:Math.max(0,Math.round(+t.value));if((e.r==null)&&(e.w==null))D.rw=D.rw.filter(x=>x!==e);const n=norm(S(sid),k);t.style.borderColor=e[k]==null?'':(e[k]>=n?'var(--ok)':'var(--warn)');save();return}
  if(a==='rwNorm'){D.cfg.rwNorm[t.dataset.k][+t.dataset.v]=Math.max(0,+t.value||0);save();return}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;
  if(t.dataset.sf&&(t.tagName==='SELECT'||t.type==='date'||t.type==='checkbox')){const sid=t.closest('[data-stu]').dataset.stu;D.students[sid][t.dataset.sf]=t.type==='checkbox'?t.checked:(t.dataset.sf==='grade'?+t.value:t.value);save();return}
  if(a==='restoreFile'&&t.files&&t.files[0]){restoreFile(t.files[0]);t.value='';return}
  if(a==='trGroup'){const dd=day(UI.date);dd.tr=dd.tr||{g:'',res:'',note:''};dd.tr.g=t.value;save();render();return}
  if(a==='ldOn'){const dd=day(UI.date);dd.ld=dd.ld||{on:false,task:'',res:'',note:'',st:{}};dd.ld.on=t.checked;save();render();return}
  if(a==='dutySet'){D.cfg.duty[t.dataset.v]=t.value;save();return}
  if(a==='supOn'){const s=S(t.dataset.id);s.support=s.support||{on:false,areas:[],plan:'',notes:[]};s.support.on=t.checked;save();stuSheet(t.dataset.id);return}
  if(a==='tdDone'){const x=D.todos.find(x=>x.id===t.dataset.v);if(x){x.done=t.checked;save();render()}return}
  if(a==='rewEdit'||a==='scSet'||a==='grpName'){render();return}
  if(a==='xFrom'||a==='xTo'){UI[a]=t.value;return}
  if(a==='rwDate'){UI.rwD=t.value||todayS();render();return}
  if(a==='rwPick'&&t.value){UI.rwD=t.value;render();return}
  if(a==='rwIn'||a==='rwNorm')return;
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('sheet').hidden){closeSheet();render()}});

/* ===================== KHỞI ĐỘNG ===================== */
D=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
if(D&&D.cfg.pin)showLock();else unlocked=true;
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
</script>
</body>
</html>
